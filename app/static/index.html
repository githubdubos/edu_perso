<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jira Ticket UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <p class="brand-name">Jira Ticket UI</p>
        <h1>Create a ticket</h1>
        <p class="lede">
          Sketch your intent, optionally point to a ma-banking wiki page and a
          client ticket, ask Cursor to draft title and description (inspired by
          tickets under the parent epic), then review and create.
        </p>
      </header>

      <form id="ticket-form" class="form" novalidate>
        <label class="field">
          <span>Intent / sketch</span>
          <textarea
            id="intent"
            name="intent"
            rows="4"
            maxlength="8000"
            placeholder="What should this ticket cover? Rough notes are fine."
          ></textarea>
        </label>

        <label class="field">
          <span>Wiki page (problem description)</span>
          <input
            id="wiki-page"
            name="wiki_page"
            type="text"
            maxlength="2000"
            autocomplete="off"
            placeholder="Page title or https://ma-banking.atlassian.net/wiki/spaces/.../pages/..."
          />
        </label>

        <label class="field">
          <span>Client ticket reference</span>
          <input
            id="client-ticket"
            name="client_ticket"
            type="text"
            maxlength="512"
            autocomplete="off"
            placeholder="e.g. ABC-123 or browse URL"
          />
        </label>

        <div class="actions actions-secondary">
          <button type="button" id="suggest-btn" class="btn-secondary">
            Suggest with AI
          </button>
        </div>

        <label class="field">
          <span>Title</span>
          <input
            id="title"
            name="title"
            type="text"
            maxlength="255"
            required
            autocomplete="off"
            placeholder="Short summary of the work"
          />
        </label>

        <label class="field">
          <span>Description</span>
          <textarea
            id="description"
            name="description"
            rows="6"
            maxlength="32000"
            placeholder="Details, context, and acceptance notes"
          ></textarea>
        </label>

        <label class="field">
          <span>
            Parent ATL
            <small>(ATL-25692: 1_RFO Backlog from Rally; ATL-25691: 0_Regulatory Gap)</small>
          </span>
          <input
            id="parent-key"
            name="parent_key"
            type="text"
            maxlength="32"
            autocomplete="off"
            value="ATL-25692"
            placeholder="e.g. ATL-25692"
          />
        </label>

        <label class="field">
          <span>Team</span>
          <input
            id="team"
            name="team"
            type="text"
            maxlength="128"
            autocomplete="off"
            value="BC.RCOFit+LR"
            placeholder="e.g. BC.RCOFit+LR"
          />
        </label>

        <div class="actions">
          <button type="submit" id="submit-btn">Create ticket</button>
        </div>
      </form>

      <div id="feedback" class="feedback" hidden role="status" aria-live="polite"></div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
